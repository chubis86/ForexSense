name: ForexSense

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore positions state
        uses: actions/cache/restore@v4
        with:
          path: positions_state.json
          key: forex-sense-positions-${{ github.run_id }}
          restore-keys: forex-sense-positions-

      - name: Run ForexSense
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          METAAPI_ACCOUNT_ID: ${{ secrets.METAAPI_ACCOUNT_ID }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python agent/main.py

      - name: Save positions state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: positions_state.json
          key: forex-sense-positions-${{ github.run_id }}
